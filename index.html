
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#091333">
<title>مغامرات العباقرة 3D</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#08132e;color:white;font-family:Tahoma,Arial;min-height:100vh}
button{font-family:inherit;cursor:pointer;border:0}
button:active{transform:scale(.93)}
#app{
 min-height:100vh;
 background:radial-gradient(ellipse at 50% 15%,#435ca6,#182755 50%,#07132e);
 overflow:hidden;
}
.page{max-width:650px;margin:auto;padding:12px}
header{
 display:flex;justify-content:space-around;align-items:center;
 background:linear-gradient(145deg,#1e3979,#09142e);
 border:2px solid #f8d46a;border-radius:18px;padding:11px 3px;
 box-shadow:0 0 15px #ffd45a55;
}
.stat{text-align:center;font-size:12px;font-weight:bold}
.stat b{display:block;color:#ffdf70;font-size:18px;margin-top:5px}
.hero{
 margin-top:14px;text-align:center;padding:15px 8px;
 border:2px solid #f7d16c;border-radius:25px;
 background:radial-gradient(ellipse at bottom,#3279cb,#18285d 65%,#111b42);
 box-shadow:0 0 20px #55baff66;
}
.world{font-size:65px;padding:5px}
.title{font-size:30px;color:#ffe078;font-weight:1000;text-shadow:0 3px #934900}
.title span{font-size:36px;color:#53dfff}
.hero p{
 display:inline-block;padding:8px 18px;border-radius:20px;
 background:linear-gradient(90deg,#a25a00,#ffe77b,#a25a00);
 color:#391b00;font-weight:bold;
}
.section{font-size:19px;color:#ffdf75;margin:20px 0 12px}
.games{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.game{
 min-height:98px;border-radius:18px;color:white;font-weight:bold;
 font-size:13px;border:2px solid #ffffff99;
 box-shadow:0 5px 0 #0006,inset 0 2px 5px #fff9;
}
.game span{display:block;font-size:35px;margin-bottom:7px}
.g1{background:linear-gradient(145deg,#a83cff,#5014a9)}
.g2{background:linear-gradient(145deg,#74e45b,#087c3d)}
.g3{background:linear-gradient(145deg,#29baff,#064cb4)}
.g4{background:linear-gradient(145deg,#ff62bd,#a6006e)}
.g5{background:linear-gradient(145deg,#ffae35,#b74b00)}
.g6{background:linear-gradient(145deg,#35e5c1,#047b72)}
.g7{background:linear-gradient(145deg,#ffda59,#aa6500)}
.g8{background:linear-gradient(145deg,#ff827c,#a92943)}
.g9{background:linear-gradient(145deg,#805bff,#30209b)}
.bottom{display:grid;grid-template-columns:1fr 1.5fr 1fr;gap:7px;margin-top:20px}
.action{
 padding:12px 8px;border-radius:17px;font-size:14px;font-weight:bold;
 background:linear-gradient(145deg,#fff18c,#f3a700);
 color:#351900;box-shadow:0 4px 0 #995300;margin:4px;
}
.back{background:linear-gradient(145deg,#9eafff,#4d64b0);color:white}
.purple{background:linear-gradient(145deg,#b45cff,#5420ae);color:white}
#gameScreen,#parents{display:none}
.card{
 background:linear-gradient(145deg,#192f68,#101a40);
 border:2px solid #f2cf66;border-radius:25px;
 padding:14px;margin-top:20px;
 box-shadow:0 0 18px #3d9dff44;
}
#gameTitle{color:#ffdf76;text-align:center}
#playArea{
 min-height:320px;background:linear-gradient(145deg,#e8f7ff,#fff);
 border-radius:20px;color:#26345b;padding:12px;
 display:flex;flex-wrap:wrap;align-items:center;
 justify-content:center;align-content:center;overflow:hidden;
}
.target{width:100%;font-size:22px;font-weight:bold;color:#5637a2;text-align:center;margin:8px}
.message{color:#ffe17c;text-align:center;font-size:18px;font-weight:bold;min-height:35px;margin:10px}
.counter{
 width:100%;text-align:center;color:#343c68;font-size:19px;font-weight:bold;
 background:#fff2c8;border-radius:15px;padding:10px;margin-bottom:10px;
}
.tile{
 width:76px;height:76px;border-radius:19px;margin:6px;
 background:#e8edff;font-size:43px;
 box-shadow:0 5px 0 #8996b5;
 display:flex;align-items:center;justify-content:center;
}
.tile:disabled{opacity:.25;filter:grayscale(1)}
.bubble{
 border-radius:50%;background:radial-gradient(circle at 30% 25%,white,#7bdcff,#2581e8);
}
.star{background:#fff0ad;border-radius:50%}
.balloon{border-radius:50%;height:85px}
.letter{font-size:48px;color:#6035b6;background:#fff0ad;font-weight:bold}
#progress{
 width:100%;height:13px;background:#d6d9e9;border-radius:20px;
 overflow:hidden;margin:8px 0 15px;
}
#progressBar{height:100%;width:0;background:linear-gradient(90deg,#38d67d,#ffe35b);transition:width .3s}
.parentbox{background:white;color:#26345b;border-radius:17px;padding:15px;line-height:2}
footer{text-align:center;font-size:11px;padding:20px;color:#b9c9ff}
</style>
</head>
<body>
<div id="app">
<div class="page">

<header>
 <div class="stat">⭐ النجوم<b id="stars">0</b></div>
 <div class="stat">🏆 المستوى<b id="level">1</b></div>
 <div class="stat">🎮 الألعاب<b id="played">0</b></div>
 <div class="stat">🎁 الهدايا<b id="gifts">0</b></div>
</header>

<section id="home">
 <div class="hero">
  <div class="world">🤖 🧒 🏰 🚀</div>
  <div class="title">👑 مغامرات<br><span>العباقرة 3D</span></div>
  <p>⭐ العب بالذكاء .. وتعلم بمتعة ⭐</p>
 </div>

 <div class="section">🌈 اختر مغامرتك</div>
 <div class="games">
  <button class="game g1" onclick="startGame('bubbles')"><span>🫧</span>فقاعات المرح</button>
  <button class="game g2" onclick="startGame('animals')"><span>🐥</span>الحيوانات</button>
  <button class="game g3" onclick="startGame('colors')"><span>🎨</span>الألوان</button>
  <button class="game g4" onclick="startGame('stars')"><span>⭐</span>النجوم</button>
  <button class="game g5" onclick="startGame('balloons')"><span>🎈</span>البالونات</button>
  <button class="game g6" onclick="startGame('shapes')"><span>🔺</span>الأشكال</button>
  <button class="game g7" onclick="startGame('sounds')"><span>🐘</span>الأصوات</button>
  <button class="game g8" onclick="startGame('garden')"><span>🌳</span>الحديقة</button>
  <button class="game g9" onclick="startGame('letters')"><span>🔤</span>الحروف</button>
 </div>

 <div class="bottom">
  <button class="action purple" onclick="openParents()">👨‍👩‍👧 الأهل</button>
  <button class="action" onclick="startGame('bubbles')">▶ ابدأ اللعب</button>
  <button class="action back" onclick="resetProgress()">↻ تصفير</button>
 </div>
</section>

<section id="gameScreen">
 <div class="card">
  <h2 id="gameTitle">🎮 اللعبة</h2>
  <div id="progress"><div id="progressBar"></div></div>
  <div id="playArea"></div>
  <div class="message" id="message">هيا نلعب يا بطل!</div>
  <button class="action" onclick="repeatInstruction()">🔊 اسمع السؤال</button>
  <button class="action" onclick="startRound()">🔄 إعادة اللعب</button>
  <button class="action back" onclick="goHome()">🏠 رجوع للألعاب</button>
 </div>
</section>

<section id="parents">
 <div class="card">
  <h2>👨‍👩‍👧 لوحة الأهل</h2>
  <div class="parentbox">
   ⭐ النجوم: <b id="pStars">0</b><br>
   🎮 الألعاب المكتملة: <b id="pPlayed">0</b><br>
   🎁 الهدايا: <b id="pGifts">0</b><br>
   🏆 المستوى: <b id="pLevel">1</b>
  </div>
  <button class="action" onclick="toggleSound()">🔊 تشغيل / إيقاف الصوت</button>
  <button class="action back" onclick="goHome()">🏠 رجوع</button>
 </div>
</section>

<footer>❤️ مغامرات العباقرة 3D - عالم التعلم والمرح</footer>
</div>
</div>

<script>
const $=id=>document.getElementById(id);

let data={stars:0,played:0,gifts:0,sound:true};
let current='';
let won=false;
let instruction='';
let targetCount=0;
let currentCount=0;
let targetItem=null;
let letterIndex=0;

const numberWords={
 3:'ثلاثة',4:'أربعة',5:'خمسة',
 6:'ستة',7:'سبعة',8:'ثمانية'
};

const animals=[
 {e:'🐱',n:'القطة',s:'مياو مياو'},
 {e:'🐶',n:'الكلب',s:'هو هو'},
 {e:'🐮',n:'البقرة',s:'مووو'},
 {e:'🐥',n:'العصفور',s:'تغريد'},
 {e:'🐑',n:'الخروف',s:'ماااع'},
 {e:'🐘',n:'الفيل',s:'الفيل'}
];

const colors=[
 {e:'🔴',n:'الأحمر',c:'#ff3434'},
 {e:'🔵',n:'الأزرق',c:'#2588ff'},
 {e:'🟡',n:'الأصفر',c:'#ffdf25'},
 {e:'🟢',n:'الأخضر',c:'#38c75d'}
];

const shapes=[
 {e:'🔴',n:'الدائرة'},
 {e:'🟦',n:'المربع'},
 {e:'🔺',n:'المثلث'},
 {e:'⭐',n:'النجمة'},
 {e:'❤️',n:'القلب'}
];

const letters=[
 ['أ','ألف','أسد'],['ب','باء','بطة'],['ت','تاء','تفاحة'],
 ['ث','ثاء','ثعلب'],['ج','جيم','جمل'],['ح','حاء','حصان'],
 ['خ','خاء','خروف'],['د','دال','دب'],['ذ','ذال','ذرة'],
 ['ر','راء','رمان'],['ز','زاي','زهرة'],['س','سين','سمكة'],
 ['ش','شين','شمس'],['ص','صاد','صقر'],['ض','ضاد','ضفدع'],
 ['ط','طاء','طائرة'],['ظ','ظاء','ظرف'],['ع','عين','عنب'],
 ['غ','غين','غزال'],['ف','فاء','فيل'],['ق','قاف','قمر'],
 ['ك','كاف','كتاب'],['ل','لام','ليمون'],['م','ميم','موز'],
 ['ن','نون','نحلة'],['هـ','هاء','هلال'],['و','واو','وردة'],
 ['ي','ياء','يد']
];

let audioContext=null;

function load(){
 try{
  const saved=JSON.parse(localStorage.getItem('genius3d'));
  if(saved)data={...data,...saved};
 }catch(e){}
 update();
}
function save(){
 try{localStorage.setItem('genius3d',JSON.stringify(data))}
 catch(e){}
}
function update(){
 $('stars').textContent=data.stars;
 $('level').textContent=Math.floor(data.stars/10)+1;
 $('played').textContent=data.played;
 $('gifts').textContent=data.gifts;
 $('pStars').textContent=data.stars;
 $('pPlayed').textContent=data.played;
 $('pGifts').textContent=data.gifts;
 $('pLevel').textContent=Math.floor(data.stars/10)+1;
}

function speak(text){
 if(!data.sound)return;
 if(!('speechSynthesis' in window))return;
 speechSynthesis.cancel();
 let msg=new SpeechSynthesisUtterance(text);
 msg.lang='ar-SA';
 msg.rate=.78;
 msg.pitch=1.15;
 msg.volume=1;
 let voices=speechSynthesis.getVoices();
 let voice=voices.find(v=>v.lang.toLowerCase().startsWith('ar'));
 if(voice)msg.voice=voice;
 speechSynthesis.speak(msg);
}
function beep(freq=650){
 if(!data.sound)return;
 try{
  audioContext=audioContext||new(window.AudioContext||window.webkitAudioContext)();
  if(audioContext.state==='suspended')audioContext.resume();
  let o=audioContext.createOscillator();
  let g=audioContext.createGain();
  o.frequency.value=freq;
  o.connect(g);g.connect(audioContext.destination);
  g.gain.setValueAtTime(.1,audioContext.currentTime);
  g.gain.exponentialRampToValueAtTime(.001,audioContext.currentTime+.2);
  o.start();o.stop(audioContext.currentTime+.2);
 }catch(e){}
}
function randomCount(){
 return Math.floor(Math.random()*6)+3;
}
function setInstruction(text){
 instruction=text;
 $('message').textContent='🔊 استمع جيداً يا بطل';
 speak(text);
}
function repeatInstruction(){
 speak(instruction);
}
function updateProgress(){
 $('progressBar').style.width=
 (Math.min(currentCount/targetCount,1)*100)+'%';
}
function successTap(){
 currentCount++;
 updateProgress();
 beep(650+currentCount*40);
 if(currentCount<targetCount){
  const remaining=targetCount-currentCount;
  const word=numberWords[remaining]||remaining;
  $('message').textContent='👏 أحسنت! بقي '+remaining;
  speak('أحسنت يا بطل! بقي '+word);
 }else{
  finishGame();
 }
}
function wrong(){
 $('message').textContent='حاول مرة ثانية يا صديقي ❤️';
 speak('حاول مرة ثانية يا صديقي! أنت تستطيع!');
 beep(240);
}
function finishGame(){
 if(won)return;
 won=true;
 data.stars++;
 data.played++;
 let gift=data.stars%5===0;
 if(gift)data.gifts++;
 update();save();
 $('message').textContent=gift?
 '🎁 مبروك! حصلت على هدية!':
 '🏆 أحسنت يا بطل! أكملت التحدي!';
 speak(gift?
 'رائع يا بطل! أكملت التحدي وحصلت على هدية جميلة!':
 'أحسنت يا بطل! ممتاز! لقد أكملت التحدي بنجاح!');
 beep(950);
}

function startGame(type){
 current=type;
 $('home').style.display='none';
 $('parents').style.display='none';
 $('gameScreen').style.display='block';
 letterIndex=0;
 startRound();
}
function startRound(){
 won=false;
 currentCount=0;
 targetCount=randomCount();
 $('progressBar').style.width='0%';
 $('playArea').innerHTML='';
 $('message').textContent='استمع إلى التعليمات';
 const names={
 bubbles:'🫧 فقاعات المرح',
 animals:'🐥 الحيوانات',
 colors:'🎨 الألوان',
 stars:'⭐ اجمع النجوم',
 balloons:'🎈 البالونات',
 shapes:'🔺 الأشكال',
 sounds:'🐘 أصوات الحيوانات',
 garden:'🌳 الحديقة',
 letters:'🔤 الحروف العربية'
 };
 $('gameTitle').textContent=names[current];
 const games={
 bubbles:bubblesGame,
 animals:animalsGame,
 colors:colorsGame,
 stars:starsGame,
 balloons:balloonsGame,
 shapes:shapesGame,
 sounds:soundsGame,
 garden:gardenGame,
 letters:lettersGame
 };
 if(games[current])games[current]();
}

function addCounter(){
 const box=document.createElement('div');
 box.className='counter';
 box.id='counter';
 box.textContent='0 / '+targetCount;
 $('playArea').appendChild(box);
}
function refreshCounter(){
 const box=$('counter');
 if(box)box.textContent=currentCount+' / '+targetCount;
}
function makeTile(emoji,cls,callback){
 const b=document.createElement('button');
 b.className='tile '+(cls||'');
 b.textContent=emoji;
 b.onclick=callback;
 return b;
}

/* فقاعات */
function bubblesGame(){
 let a=$('playArea');
 setInstruction('المس '+numberWords[targetCount]+' فقاعات يا بطل!');
 addCounter();
 for(let i=0;i<targetCount+3;i++){
  let b=makeTile('🫧','bubble',()=>{
   if(won||b.disabled)return;
   b.disabled=true;
   successTap();refreshCounter();
  });
  a.appendChild(b);
 }
}

/* البالونات */
function balloonsGame(){
 let a=$('playArea');
 setInstruction('المس '+numberWords[targetCount]+' بالونات يا صديقي!');
 addCounter();
 const palette=['#ff5b9e','#42bfff','#ffdb43','#63d88a'];
 for(let i=0;i<targetCount+3;i++){
  let b=makeTile('🎈','balloon',()=>{
   if(won||b.disabled)return;
   b.disabled=true;
   successTap();refreshCounter();
  });
  b.style.background=palette[i%4];
  a.appendChild(b);
 }
}

/* النجوم */
function starsGame(){
 let a=$('playArea');
 setInstruction('اجمع '+numberWords[targetCount]+' نجوم جميلة يا بطل!');
 addCounter();
 for(let i=0;i<targetCount+3;i++){
  let b=makeTile('⭐','star',()=>{
   if(won||b.disabled)return;
   b.disabled=true;
   successTap();refreshCounter();
  });
  a.appendChild(b);
 }
}

/* الحيوانات */
function animalsGame(){
 let a=$('playArea');
 targetItem=animals[Math.floor(Math.random()*animals.length)];
 setInstruction('المس '+numberWords[targetCount]+' صور لحيوان '+targetItem.n+'!');
 addCounter();
 let list=Array(targetCount).fill(targetItem);
 for(let i=0;i<3;i++){
  let other=animals[Math.floor(Math.random()*animals.length)];
  while(other===targetItem)other=animals[Math.floor(Math.random()*animals.length)];
  list.push(other);
 }
 list.sort(()=>Math.random()-.5);
 list.forEach(x=>{
  let b=makeTile(x.e,'',()=>{
   if(won||b.disabled)return;
   if(x===targetItem){
    b.disabled=true;
    successTap();refreshCounter();
   }else wrong();
  });
  a.appendChild(b);
 });
}

/* الألوان */
function colorsGame(){
 let a=$('playArea');
 targetItem=colors[Math.floor(Math.random()*colors.length)];
 setInstruction('المس اللون '+targetItem.n+' عدد '+numberWords[targetCount]+' مرات!');
 addCounter();
 let list=Array(targetCount).fill(targetItem);
 for(let i=0;i<3;i++){
  let other=colors[Math.floor(Math.random()*colors.length)];
  while(other===targetItem)other=colors[Math.floor(Math.random()*colors.length)];
  list.push(other);
 }
 list.sort(()=>Math.random()-.5);
 list.forEach(x=>{
  let b=makeTile('', '',()=>{
   if(won||b.disabled)return;
   if(x===targetItem){
    b.disabled=true;successTap();refreshCounter();
   }else wrong();
  });
  b.style.background=x.c;
  b.style.border='4px solid white';
  a.appendChild(b);
 });
}

/* الأشكال */
function shapesGame(){
 let a=$('playArea');
 targetItem=shapes[Math.floor(Math.random()*shapes.length)];
 setInstruction('ابحث عن '+targetItem.n+' والمسها '+numberWords[targetCount]+' مرات!');
 addCounter();
 let list=Array(targetCount).fill(targetItem);
 for(let i=0;i<3;i++){
  let other=shapes[Math.floor(Math.random()*shapes.length)];
  while(other===targetItem)other=shapes[Math.floor(Math.random()*shapes.length)];
  list.push(other);
 }
 list.sort(()=>Math.random()-.5);
 list.forEach(x=>{
  let b=makeTile(x.e,'',()=>{
   if(won||b.disabled)return;
   if(x===targetItem){
    b.disabled=true;successTap();refreshCounter();
   }else wrong();
  });
  a.appendChild(b);
 });
}

/* أصوات الحيوانات */
function soundsGame(){
 let a=$('playArea');
 targetItem=animals[Math.floor(Math.random()*animals.length)];
 setInstruction('اسمع صوت الحيوان ثم المس صورة '+targetItem.n+' عدد '+numberWords[targetCount]+' مرات!');
 addCounter();
 let listen=document.createElement('button');
 listen.className='action';
 listen.textContent='🔊 اسمع صوت الحيوان';
 listen.onclick=()=>speak(targetItem.s);
 a.appendChild(listen);
 let list=Array(targetCount).fill(targetItem);
 for(let i=0;i<3;i++){
  let other=animals[Math.floor(Math.random()*animals.length)];
  while(other===targetItem)other=animals[Math.floor(Math.random()*animals.length)];
  list.push(other);
 }
 list.sort(()=>Math.random()-.5);
 list.forEach(x=>{
  let b=makeTile(x.e,'',()=>{
   if(won||b.disabled)return;
   if(x===targetItem){
    b.disabled=true;successTap();refreshCounter();
   }else wrong();
  });
  a.appendChild(b);
 });
}

/* الحديقة */
function gardenGame(){
 let a=$('playArea');
 setInstruction('اسقِ '+numberWords[targetCount]+' نباتات حتى تكبر يا بطل!');
 addCounter();
 for(let i=0;i<targetCount+2;i++){
  let b=makeTile('🌱','',()=>{
   if(won||b.disabled)return;
   b.disabled=true;
   b.textContent='🌻';
   successTap();refreshCounter();
  });
  a.appendChild(b);
 }
}

/* الحروف */
function lettersGame(){
 let a=$('playArea');
 targetItem=letters[Math.floor(Math.random()*letters.length)];
 setInstruction('ابحث عن حرف '+targetItem[1]+' والمس الحرف '+numberWords[targetCount]+' مرات!');
 addCounter();
 let listen=document.createElement('button');
 listen.className='action';
 listen.textContent='🔊 اسمع الحرف';
 listen.onclick=()=>speak('حرف '+targetItem[1]+' مثل '+targetItem[2]);
 a.appendChild(listen);

 let list=Array(targetCount).fill(targetItem);
 for(let i=0;i<3;i++){
  let other=letters[Math.floor(Math.random()*letters.length)];
  while(other===targetItem)other=letters[Math.floor(Math.random()*letters.length)];
  list.push(other);
 }
 list.sort(()=>Math.random()-.5);
 list.forEach(x=>{
  let b=makeTile(x[0],'letter',()=>{
   if(won||b.disabled)return;
   if(x===targetItem){
    b.disabled=true;
    successTap();
    refreshCounter();
    if(currentCount===targetCount){
     speak('أحسنت! هذا حرف '+x[1]+' مثل '+x[2]);
    }
   }else wrong();
  });
  a.appendChild(b);
 });
}

function goHome(){
 if('speechSynthesis'in window)speechSynthesis.cancel();
 $('home').style.display='block';
 $('gameScreen').style.display='none';
 $('parents').style.display='none';
}
function openParents(){
 $('home').style.display='none';
 $('gameScreen').style.display='none';
 $('parents').style.display='block';
 update();
}
function toggleSound(){
 data.sound=!data.sound;
 if(!data.sound&&'speechSynthesis'in window)speechSynthesis.cancel();
 save();update();
}
function resetProgress(){
 if(!confirm('هل تريد حذف جميع النجوم والهدايا والتقدم؟'))return;
