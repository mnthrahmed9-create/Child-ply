
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#071333">
<title>مغامرات العباقرة 3D</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;font-family:Tahoma,Arial;
 background:#07132f;color:white;
 min-height:100vh;overflow-x:hidden;
}
button{font-family:inherit;cursor:pointer;border:0}
button:active{transform:scale(.94)}
#app{
 min-height:100vh;
 background:radial-gradient(ellipse at 50% 20%,#394e9b,#101b48 55%,#07132f);
}
.page{max-width:650px;margin:auto;padding:12px}
header{
 display:flex;justify-content:space-around;
 background:linear-gradient(135deg,#172e68,#07142e);
 border:2px solid #e9c45f;border-radius:17px;
 padding:10px 4px;box-shadow:0 0 15px #ffce5b55;
}
.stat{font-size:12px;text-align:center}
.stat b{display:block;color:#ffdf68;font-size:17px;margin-top:5px}
.hero{
 margin-top:15px;padding:15px 8px;
 text-align:center;border:2px solid #f4ce64;
 border-radius:25px;
 background:radial-gradient(ellipse at bottom,#2369bd,#142254 65%,#101839);
 box-shadow:0 0 22px #48aaff55;
}
.world{font-size:75px;margin:8px}
.title{font-size:30px;color:#ffdf68;text-shadow:0 3px #8e4900}
.title span{color:#51dfff;font-size:36px}
.hero p{background:linear-gradient(90deg,#a35e00,#ffe67b,#a35e00);
 color:#351900;padding:8px;border-radius:15px;font-weight:bold}
.section{color:#ffdf70;font-size:19px;margin:20px 0 12px}
.games{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.game{
 min-height:95px;border-radius:18px;color:white;
 font-weight:bold;font-size:13px;
 border:2px solid #ffffff99;
 box-shadow:0 5px 0 #0005,inset 0 2px 5px #fff8;
}
.game span{display:block;font-size:35px;margin-bottom:7px}
.g1{background:linear-gradient(145deg,#a83cff,#5014a9)}
.g2{background:linear-gradient(145deg,#74e45b,#087c3d)}
.g3{background:linear-gradient(145deg,#29baff,#064cb4)}
.g4{background:linear-gradient(145deg,#ff62bd,#a6006e)}
.g5{background:linear-gradient(145deg,#ffae35,#b74b00)}
.g6{background:linear-gradient(145deg,#35e5c1,#047b72)}
.g7{background:linear-gradient(145deg,#ffda59,#aa6500)}
.g8{background:linear-gradient(145deg,#ff827c,#a92943)}
.g9{background:linear-gradient(145deg,#805bff,#30209b)}
.bottom{
 display:grid;grid-template-columns:1fr 1.5fr 1fr;
 gap:7px;margin-top:20px;
}
.action{
 padding:12px 8px;border-radius:17px;
 font-size:14px;font-weight:bold;
 background:linear-gradient(145deg,#fff18c,#f3a700);
 color:#351900;box-shadow:0 4px 0 #995300;
 margin:4px;
}
.back{background:linear-gradient(145deg,#9eafff,#4d64b0);color:white}
.purple{background:linear-gradient(145deg,#b45cff,#5420ae);color:white}
#gameScreen,#parents{display:none}
.card{
 background:linear-gradient(145deg,#192f68,#101a40);
 border:2px solid #f2cf66;border-radius:25px;
 padding:14px;margin-top:20px;
 box-shadow:0 0 18px #3d9dff44;
}
#gameTitle{color:#ffdf76;font-size:23px}
#playArea{
 min-height:330px;background:linear-gradient(145deg,#e8f7ff,#fff);
 border-radius:20px;color:#26345b;padding:12px;
 display:flex;flex-wrap:wrap;
 align-items:center;justify-content:center;
 align-content:center;overflow:hidden;
}
.target{
 width:100%;font-size:22px;font-weight:bold;
 color:#5637a2;margin:10px;
}
.message{color:#ffe17c;font-size:19px;font-weight:bold;min-height:35px;margin:10px}
.choice{
 width:85px;height:85px;border-radius:20px;
 background:#e4f0ff;font-size:49px;margin:6px;
 box-shadow:0 5px 0 #8b9cba;
}
.bubble{
 width:70px;height:70px;border-radius:50%;
 margin:8px;font-size:30px;
 background:radial-gradient(circle at 30% 25%,white,#7bdcff,#2581e8);
 box-shadow:inset -5px -6px 12px #1456a477,0 4px 7px #888;
}
.balloon{
 width:65px;height:82px;border-radius:50%;
 margin:8px;box-shadow:inset -7px -7px 12px #0003;
}
.star{font-size:57px;background:#fff0a8;border-radius:50%;padding:10px;margin:6px}
.letter{
 font-size:65px;font-weight:bold;color:#6a39bd;
 background:#fff0ad;border-radius:20px;
 width:90px;height:90px;margin:7px;
 box-shadow:0 5px 0 #c39840;
}
.parentbox{background:white;color:#24325b;border-radius:17px;padding:15px;line-height:2}
footer{text-align:center;font-size:11px;padding:20px;color:#b9c9ff}
</style>
</head>

<body>
<div id="app">
<div class="page">

<header>
 <div class="stat">⭐ النجوم<b id="stars">0</b></div>
 <div class="stat">🏆 المستوى<b id="level">1</b></div>
 <div class="stat">🎮 الألعاب<b id="played">0</b></div>
 <div class="stat">🎁 الهدايا<b id="gifts">0</b></div>
</header>

<section id="home">
 <div class="hero">
  <div class="world">🤖 🧒 🏰 🚀</div>
  <div class="title">👑 مغامرات<br><span>العباقرة 3D</span></div>
  <p>⭐ العب بالذكاء .. وتعلم بمتعة ⭐</p>
 </div>

 <div class="section">🌈 اختر مغامرتك</div>
 <div class="games">
  <button class="game g1" onclick="startGame('bubbles')"><span>🫧</span>فقاعات المرح</button>
  <button class="game g2" onclick="startGame('animals')"><span>🐥</span>أين الحيوان؟</button>
  <button class="game g3" onclick="startGame('colors')"><span>🎨</span>تعلم الألوان</button>
  <button class="game g4" onclick="startGame('stars')"><span>⭐</span>اجمع النجوم</button>
  <button class="game g5" onclick="startGame('balloons')"><span>🎈</span>بالونات المرح</button>
  <button class="game g6" onclick="startGame('shapes')"><span>🔺</span>تعلم الأشكال</button>
  <button class="game g7" onclick="startGame('sounds')"><span>🐘</span>أصوات الحيوانات</button>
  <button class="game g8" onclick="startGame('garden')"><span>🌳</span>ازرع حديقتك</button>
  <button class="game g9" onclick="startGame('letters')"><span>🔤</span>تعلم الحروف</button>
 </div>

 <div class="bottom">
  <button class="action purple" onclick="openParents()">👨‍👩‍👧 الأهل</button>
  <button class="action" onclick="startGame('bubbles')">▶ ابدأ اللعب</button>
  <button class="action back" onclick="resetProgress()">↻ تصفير</button>
 </div>
</section>

<section id="gameScreen">
 <div class="card">
  <h2 id="gameTitle">🎮 اللعبة</h2>

  <div id="playArea"></div>
  <div class="message" id="message">هيا نلعب يا بطل!</div>

  <button class="action" onclick="repeatInstruction()">🔊 اسمع مرة ثانية</button>
  <button class="action" onclick="startRound()">🔄 العب من جديد</button>
  <button class="action back" onclick="goHome()">🏠 رجوع للألعاب</button>
 </div>
</section>

<section id="parents">
 <div class="card">
  <h2>👨‍👩‍👧 لوحة الأهل</h2>
  <div class="parentbox">
   ⭐ النجوم: <b id="pStars">0</b><br>
   🎮 الألعاب المكتملة: <b id="pPlayed">0</b><br>
   🎁 الهدايا: <b id="pGifts">0</b>
  </div>
  <button class="action" onclick="toggleSound()">🔊 تشغيل / إيقاف الصوت</button>
  <button class="action back" onclick="goHome()">🏠 رجوع</button>
 </div>
</section>

<footer>❤️ عالم آمن للتعلم والمرح بإشراف الأهل</footer>
</div>
</div>

<script>
const $=id=>document.getElementById(id);

let data={stars:0,played:0,gifts:0,sound:true};
let current='',won=false;
let instruction='';
let letterIndex=0;
let roundNumber=0;
let voiceTimer=null;

const letters=[
 ['أ','أَ','أسد'],['ب','بَ','بطة'],['ت','تَ','تفاحة'],
 ['ث','ثَ','ثعلب'],['ج','جَ','جمل'],['ح','حَ','حصان'],
 ['خ','خَ','خروف'],['د','دَ','دب'],['ذ','ذَ','ذرة'],
 ['ر','رَ','رمان'],['ز','زَ','زهرة'],['س','سَ','سمكة'],
 ['ش','شَ','شمس'],['ص','صَ','صقر'],['ض','ضَ','ضفدع'],
 ['ط','طَ','طائرة'],['ظ','ظَ','ظرف'],['ع','عَ','عنب'],
 ['غ','غَ','غزال'],['ف','فَ','فيل'],['ق','قَ','قمر'],
 ['ك','كَ','كتاب'],['ل','لَ','ليمون'],['م','مَ','موز'],
 ['ن','نَ','نحلة'],['هـ','هَ','هلال'],['و','وَ','وردة'],
 ['ي','يَ','يد']
];

const animals=[
 {e:'🐱',n:'القطة',s:'مياو مياو'},
 {e:'🐶',n:'الكلب',s:'هو هو'},
 {e:'🐮',n:'البقرة',s:'مووو'},
 {e:'🐥',n:'العصفور',s:'تغريد'},
 {e:'🐑',n:'الخروف',s:'ماااع'},
 {e:'🐘',n:'الفيل',s:'الفيل الكبير'}
];

const colors=[
 {n:'الأحمر',c:'#ff3434'},
 {n:'الأزرق',c:'#2588ff'},
 {n:'الأصفر',c:'#ffdf25'},
 {n:'الأخضر',c:'#38c75d'}
];

let audioContext=null;

function load(){
 try{
  const x=JSON.parse(localStorage.getItem('genius3d'));
  if(x)data={...data,...x};
 }catch(e){}
 update();
}

function save(){
 try{localStorage.setItem('genius3d',JSON.stringify(data))}
 catch(e){}
}

function update(){
 $('stars').textContent=data.stars;
 $('level').textContent=Math.floor(data.stars/10)+1;
 $('played').textContent=data.played;
 $('gifts').textContent=data.gifts;
 $('pStars').textContent=data.stars;
 $('pPlayed').textContent=data.played;
 $('pGifts').textContent=data.gifts;
}

function speak(text){
 if(!data.sound)return;
 if(!('speechSynthesis' in window)){
  $('message').textContent='الصوت غير مدعوم في هذا الهاتف';
  return;
 }
 speechSynthesis.cancel();
 clearTimeout(voiceTimer);

 const msg=new SpeechSynthesisUtterance(text);
 msg.lang='ar-SA';
 msg.rate=.78;
 msg.pitch=1.15;
 msg.volume=1;

 let voices=speechSynthesis.getVoices();
 let arabic=voices.find(v=>v.lang.toLowerCase().startsWith('ar'));
 if(arabic)msg.voice=arabic;

 speechSynthesis.speak(msg);
}

function beep(freq=650){
 if(!data.sound)return;
 try{
  audioContext=audioContext||new(window.AudioContext||window.webkitAudioContext)();
  if(audioContext.state==='suspended')audioContext.resume();
  let o=audioContext.createOscillator();
  let g=audioContext.createGain();
  o.frequency.value=freq;
  o.connect(g);g.connect(audioContext.destination);
  g.gain.setValueAtTime(.1,audioContext.currentTime);
  g.gain.exponentialRampToValueAtTime(.001,audioContext.currentTime+.2);
  o.start();o.stop(audioContext.currentTime+.2);
 }catch(e){}
}

function say(text){
 $('message').textContent=text;
 speak(text);
 beep(850);
}

function correct(){
 if(won)return;
 won=true;
 data.stars++;
 data.played++;

 if(data.stars%5===0){
  data.gifts++;
  $('message').textContent='🎁 أحسنت يا بطل! حصلت على هدية!';
  speak('أحسنت يا بطل! حصلت على هدية جميلة!');
 }else{
  say('أحسنت يا بطل! ممتاز! هذه إجابة صحيحة!');
 }
 update();save();
}

function wrong(){
 $('message').textContent='حاول مرة ثانية يا صديقي!';
 speak('حاول مرة ثانية يا صديقي! أنت تستطيع!');
 beep(250);
}

const instructions={
 bubbles:'المس خمس فقاعات يا بطل. اضغط على الفقاعات الجميلة!',
 animals:'استمع جيداً! ابحث عن الحيوان الذي أطلبه منك!',
 colors:'هيا نتعلم الألوان! المس اللون الذي تسمعه!',
 stars:'اجمع خمس نجوم يا صديقي. المس النجوم الجميلة!',
 balloons:'المس خمس بالونات ملونة يا بطل!',
 shapes:'هيا نتعلم الأشكال! ابحث عن الشكل الصحيح!',
 sounds:'المس الحيوان واستمع إلى صوته الجميل!',
 garden:'المس النبتة عدة مرات حتى تصبح شجرة جميلة!',
 letters:'هيا نتعلم الحروف العربية! استمع إلى الحرف ثم اختره!'
};

function startGame(type){
 current=type;
 $('home').style.display='none';
 $('parents').style.display='none';
 $('gameScreen').style.display='block';
 letterIndex=0;
 startRound();
}

function startRound(){
 won=false;
 roundNumber++;
 $('message').textContent='استمع إلى التعليمات يا بطل!';
 $('playArea').innerHTML='';
 const names={
 bubbles:'🫧 فقاعات المرح',
 animals:'🐥 أين الحيوان؟',
 colors:'🎨 تعلم الألوان',
 stars:'⭐ اجمع النجوم',
 balloons:'🎈 بالونات المرح',
 shapes:'🔺 تعلم الأشكال',
 sounds:'🐘 أصوات الحيوانات',
 garden:'🌳 ازرع حديقتك',
 letters:'🔤 تعلم الحروف العربية'
 };
 $('gameTitle').textContent=names[current];

 instruction=instructions[current];
 const games={
 bubbles:bubblesGame,
 animals:animalsGame,
 colors:colorsGame,
 stars:starsGame,
 balloons:balloonsGame,
 shapes:shapesGame,
 sounds:soundsGame,
 garden:gardenGame,
 letters:lettersGame
 };
 if(games[current])games[current]();

 // تأخير بسيط حتى يستقر عرض اللعبة قبل نطق التعليمات
 setTimeout(()=>speak(instruction),350);
}

function repeatInstruction(){
 if(current==='letters'){
  speak(letterPrompt);
 }else{
  speak(instruction);
 }
}

function button(text,cls,fn){
 let b=document.createElement('button');
 b.className=cls;
 b.textContent=text;
 b.onclick=fn;
 return b;
}

function bubblesGame(){
 let a=$('playArea'),n=0;
 a.innerHTML='<div class="target">🫧 🫧 🫧</div>';
 for(let i=0;i<8;i++){
  let b=button('🫧','bubble',()=>{
   if(b.dataset.hit)return;
   b.dataset.hit='1';
   b.textContent='✨';
   n++;
   beep(650+n*40);
   if(n===5)correct();
  });
  a.appendChild(b);
 }
}

function animalsGame(){
 let a=$('playArea');
 let target=animals[Math.floor(Math.random()*animals.length)];
 let list=[target,...animals.filter(x=>x!==target).sort(()=>Math.random()-.5).slice(0,2)];
 list.sort(()=>Math.random()-.5);
 $('message').textContent='أين '+target.n+'؟';
 instruction='أين '+target.n+'؟ المس صورة '+target.n;
 list.forEach(x=>{
  a.appendChild(button(x.e,'choice',()=>{
   if(won)return;
   if(x===target){
    correct();
    setTimeout(()=>speak(x.n+'، '+x.s),900);
   }else wrong();
  }));
 });
}

function colorsGame(){
 let a=$('playArea');
 let target=colors[Math.floor(Math.random()*colors.length)];
 $('message').textContent='أين اللون '+target.n+'؟';
 instruction='أين اللون '+target.n+'؟ المس اللون الصحيح';
 colors.forEach(x=>{
  let b=button('','choice',()=>{
   if(won)return;
   if(x===target)correct();
   else wrong();
  });
  b.style.background=x.c;
  a.appendChild(b);
 });
}

function starsGame(){
 let a=$('playArea'),n=0;
 for(let i=0;i<7;i++){
  a.appendChild(button('⭐','star',function(){
   if(this.dataset.hit)return;
   this.dataset.hit='1';
   this.style.visibility='hidden';
   n++;beep(700+n*40);
   if(n===5)correct();
  }));
 }
}

function balloonsGame(){
 let a=$('playArea'),n=0;
 const palette=['#ff6ca8','#4ebdff','#ffdb4c','#6cda88'];
 for(let i=0;i<7;i++){
  let b=button('','balloon',()=>{
   if(b.dataset.hit)return;
   b.dataset.hit='1';
   b.style.visibility='hidden';
   n++;beep(500+n*60);
   if(n===5)correct();
  });
  b.style.background=palette[i%4];
  a.appendChild(b);
 }
}

function shapesGame(){
 let a=$('playArea');
 let shapes=[
  {e:'🔴',n:'الدائرة'},
  {e:'🟦',n:'المربع'},
  {e:'🔺',n:'المثلث'},
  {e:'❤️',n:'القلب'}
 ];
 let target=shapes[Math.floor(Math.random()*shapes.length)];
 $('message').textContent='أين '+target.n+'؟';
 instruction='أين '+target.n+'؟ اختر الشكل الصحيح';
 shapes.sort(()=>Math.random()-.5).forEach(x=>{
  a.appendChild(button(x.e,'choice',()=>{
   if(won)return;
   if(x===target)correct();
   else wrong();
  }));
 });
}

function soundsGame(){
 let a=$('playArea');
 let x=animals[Math.floor(Math.random()*animals.length)];
 $('message').textContent='المس الحيوان!';
 a.appendChild(button(x.e,'choice',()=>{
  if(won)return;
  speak(x.n+'، '+x.s);
  $('message').textContent=x.n+' '+x.s;
  correct();
 }));
 instruction='المس صورة الحيوان واستمع إلى صوته!';
}

function gardenGame(){
 let a=$('playArea'),count=0;
 let b=button('🌱','choice',()=>{
  if(won)return;
  count++;
  b.textContent=['🌿','🌷','🌻','🌳🦋'][Math.min(count-1,3)];
  beep(600+count*80);
  if(count===4)correct();
  else{
   $('message').textContent='رائع! النبتة تكبر!';
   speak('رائع! النبتة تكبر!');
  }
 });
 b.style.width='180px';b.style.height='150px';
 a.appendChild(b);
}

let letterPrompt='';

function lettersGame(){
 let a=$('playArea');
 let item=letters[letterIndex%letters.length];
 letterPrompt='أين حرف '+item[0]+'؟ حرف '+item[0]+' مثل '+item[2];
 $('message').textContent='استمع واختر الحرف الصحيح';
 instruction=letterPrompt;

 let options=[item];
 while(options.length<3){
  let other=letters[Math.floor(Math.random()*letters.length)];
  if(!options.includes(other))options.push(other);
 }
 options.sort(()=>Math.random()-.5);

 options.forEach(x=>{
  a.appendChild(button(x[0],'letter',()=>{
   if(won)return;
   if(x===item){
    correct();
    speak('أحسنت! هذا حرف '+item[0]+' مثل '+item[2]);
    letterIndex++;
    let next=button('حرف آخر ➡️','action',()=>{
     startRound();
    });
    a.appendChild(next);
   }else wrong();
  }));
 });
}

function goHome(){
 if('speechSynthesis'in window)speechSynthesis.cancel();
 $('home').style.display='block';
 $('gameScreen').style.display='none';
 $('parents').style.display='none';
}

function openParents(){
 $('home').style.display='none';
 $('gameScreen').style.display='none';
 $('parents').style.display='block';
 update();
}

function toggleSound(){
 data.sound=!data.sound;
 if(!data.sound&&'speechSynthesis'in window)speechSynthesis.cancel();
 save();update();
}

function resetProgress(){
 if(!confirm('هل تريد حذف كل النجوم والهدايا؟'))return;
 data.stars=0;data.played=0;data.gifts=0;
 save();update();
}

load();
</script>
</body>
</html>
