<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ألعاب الصغار | Kids Fun Games</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;font-family:'Comic Sans MS', 'Segoe UI', Tahoma, Arial, sans-serif;}
html,body{margin:0;height:100%;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:manipulation;}
body{
  background: linear-gradient(180deg, #4facfe 0%, #00f2fe 40%, #a8e063 40%, #56ab2f 100%);
  display:flex; justify-content:center; align-items:center;
}

/* خلفية أشبه بالصورة */
.bg-elements {
  position: absolute; inset: 0; overflow: hidden; z-index: -1; pointer-events: none;
}
.rainbow { position: absolute; top: 5%; left: 10%; width: 80%; height: 30%; border-radius: 50% 50% 0 0; border: 15px solid; border-color: #ff4b4b transparent transparent transparent; opacity: 0.6; }
.cloud { position: absolute; background: #fff; border-radius: 50px; opacity: 0.8; }
.c1 { width: 100px; height: 40px; top: 10%; left: 10%; }
.c1::before, .c1::after { content: ''; position: absolute; background: #fff; border-radius: 50%; }
.c1::before { width: 50px; height: 50px; top: -20px; left: 15px; }
.c1::after { width: 70px; height: 70px; top: -30px; left: 40px; }
.c2 { width: 120px; height: 50px; top: 25%; right: 10%; }

/* الحاوية الرئيسية */
#app{
  display:flex; flex-direction:column; height:100dvh; width:100%; max-width:650px; margin:auto;
  position:relative; padding: 10px; z-index: 1;
}

/* الهيدر */
header{display:flex; align-items:center; justify-content:space-between; padding:5px 10px;}
.hbtn{
  border: 3px solid #8b5a2b; background: linear-gradient(180deg, #f5cfa0, #d89c5d); border-radius: 20px;
  padding: 8px 15px; font-size: 26px; cursor: pointer; box-shadow: 0 5px 0 #6b3e1b;
  display: flex; align-items: center; justify-content: center; color: #fff; text-shadow: 1px 1px 2px #000;
}
.hbtn:active{transform:translateY(4px); box-shadow:0 1px 0 #6b3e1b;}
.stars{
  border: 3px solid #8b5a2b; background: linear-gradient(180deg, #f5cfa0, #d89c5d); border-radius: 20px;
  padding: 6px 15px; font-size: 22px; font-weight: 900; color: #fff; box-shadow: 0 5px 0 #6b3e1b;
  text-shadow: 1px 1px 2px #000; display: flex; align-items: center; gap: 5px;
}

/* الشاشة (Stage) */
#stage{flex:1; display:flex; flex-direction:column; min-height:0; position:relative; margin-top: 10px;}

/* اللوحة الخشبية (العنوان) */
.wood-banner {
  background: linear-gradient(180deg, #d89c5d, #b87232);
  border: 6px solid #8b5a2b;
  border-radius: 30px;
  padding: 10px 20px;
  text-align: center;
  box-shadow: 0 10px 0 #5a3313, inset 0 4px 10px rgba(255,255,255,0.3);
  margin-bottom: 20px;
  position: relative;
}
.wood-banner h1 {
  margin: 0;
  font-size: 38px;
  color: #ff66b2;
  text-shadow: 2px 2px 0 #fff, -2px -2px 0 #fff, 2px -2px 0 #fff, -2px 2px 0 #fff, 0 4px 0 #2980b9;
  letter-spacing: 2px;
}
.wood-banner p {
  margin: 5px 0 0;
  font-size: 16px;
  color: #5a3313;
  font-weight: bold;
}

/* القائمة */
.menu{display:grid; grid-template-columns:repeat(2, 1fr); gap:15px; align-content:start; flex:1; overflow-y:auto; padding:5px;}
@media(min-width:620px){.menu{grid-template-columns:repeat(2, 1fr);}}

/* تصميم الأزرار الكرتونية */
.card{
  border: 0; border-radius: 25px; padding: 15px 10px; color: #fff; font-size: 20px; font-weight: 900;
  cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px;
  box-shadow: inset 0 6px 0 rgba(255,255,255,0.4), 0 8px 0 rgba(0,0,0,0.2);
  position: relative; overflow: hidden; text-shadow: 1px 1px 2px rgba(0,0,0,0.3);
  transition: transform 0.1s;
}
.card:active{transform: translateY(6px); box-shadow: inset 0 2px 0 rgba(255,255,255,0.4), 0 2px 0 rgba(0,0,0,0.2);}
.card .em{font-size: 45px; line-height: 1; text-shadow: none; margin-bottom: 5px;}
.card .label-bg {
  background: rgba(0,0,0,0.2); border-radius: 20px; padding: 4px 15px; width: 90%;
  text-align: center; font-size: 18px; border: 1px solid rgba(255,255,255,0.3);
}

/* ألوان الأزرار كما في الصورة */
.btn-red { background: linear-gradient(180deg, #ff6b6b, #e53935); }
.btn-blue { background: linear-gradient(180deg, #4fc3f7, #1e88e5); }
.btn-purple { background: linear-gradient(180deg, #ba68c8, #8e24aa); }
.btn-green1 { background: linear-gradient(180deg, #aed581, #43a047); }
.btn-orange { background: linear-gradient(180deg, #ffb74d, #f57c00); }
.btn-green2 { background: linear-gradient(180deg, #81c784, #388e3c); }
.btn-purple2 { background: linear-gradient(180deg, #b39ddb, #673ab7); }
.btn-pink { background: linear-gradient(180deg, #f06292, #d81b60); }

/* عناصر أسفل الشاشة (كلب وقطار) */
.bottom-decor {
  position: absolute; bottom: -10px; left: 0; right: 0; height: 80px; pointer-events: none;
  display: flex; justify-content: space-between; align-items: flex-end; padding: 0 10px; z-index: 10;
}
.dog { font-size: 70px; transform: translateY(10px); filter: drop-shadow(0 5px 5px rgba(0,0,0,0.3)); }
.train { font-size: 60px; transform: translateY(5px); filter: drop-shadow(0 5px 5px rgba(0,0,0,0.3)); }

/* باقي الأنماط للألعاب الداخلية */
.prompt{display:flex; align-items:center; justify-content:center; gap:12px; font-size:26px; font-weight:800; color:#3b2a7a; text-align:center; margin:6px 0;}
.spk{border:0;background:#ffd34d;border-radius:50%;width:52px;height:52px;font-size:26px;box-shadow:0 4px 0 rgba(0,0,0,.2);cursor:pointer;}
.big{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;font-size:clamp(60px,18vw,130px);line-height:1.1;word-break:break-all;min-height:0;}
.big svg{width:min(45vw,230px);height:min(45vw,230px);}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;flex:0 0 auto; margin-top: 10px;}
.opt{border:0;background:#fff;border-radius:26px;aspect-ratio:1;font-size:clamp(40px,12vw,80px);display:flex;align-items:center;justify-content:center;box-shadow:0 6px 0 rgba(0,0,0,.18);cursor:pointer;padding:6px;font-family:inherit;font-weight:800;color:#3b2a7a;}
.opt svg{width:78%;height:78%;}
.opt .dot{width:75%;height:75%;border-radius:50%;box-shadow:inset -6px -6px 0 rgba(0,0,0,.15);}
.opt.good{background:#8df0a2;animation:bounce .6s;}
.opt.bad{background:#ffb3b3;animation:shake .4s;}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
@keyframes bounce{0%,100%{transform:scale(1)}40%{transform:scale(1.2)}}
.hint{font-size:20px;color:#7a5c00;font-weight:700;text-align:center;min-height:28px;}
.target{text-align:center;font-size:26px;font-weight:800;color:#3b2a7a;padding:4px;}
.balloons{position:relative;flex:1;overflow:hidden;border-radius:24px;background:linear-gradient(#8fd3ff,#d8f3ff);}
.balloon{position:absolute;bottom:-150px;width:84px;height:104px;border-radius:50% 50% 50% 50%/42% 42% 58% 58%;animation:rise linear forwards;box-shadow:inset -9px -9px 0 rgba(0,0,0,.13),inset 8px 8px 0 rgba(255,255,255,.25);cursor:pointer;}
.balloon::after{content:"";position:absolute;left:50%;top:100%;width:2px;height:40px;background:#fff8;}
@keyframes rise{to{transform:translateY(-135vh)}}
.balloon.pop{animation:popA .3s forwards;}
@keyframes popA{to{transform:scale(1.8);opacity:0}}
.balloon.wrong{animation-play-state:paused;}
.mem{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;flex:1;align-content:center;}
.mc{aspect-ratio:1;border:0;border-radius:22px;font-size:clamp(40px,12vw,76px);background:#7c5cff;color:#fff;box-shadow:0 5px 0 rgba(0,0,0,.2);cursor:pointer;display:flex;align-items:center;justify-content:center;}
.mc.open{background:#fff;}
.mc.done{background:#b9f6ca;}
.tools{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:6px;}
.sw{width:42px;height:42px;border-radius:50%;border:4px solid #fff;box-shadow:0 3px 0 rgba(0,0,0,.2);cursor:pointer;}
.sw.sel{border-color:#333;}
canvas{flex:1;width:100%;background:#fff;border-radius:24px;touch-action:none;box-shadow:0 4px 0 rgba(0,0,0,.15);min-height:0;}
.conf{position:fixed;top:-40px;font-size:32px;pointer-events:none;animation:fall 1.6s ease-in forwards;z-index:50;}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg);opacity:.7}}
</style>
</head>
<body>

<!-- خلفية الكرتون -->
<div class="bg-elements">
  <div class="rainbow"></div>
  <div class="cloud c1"></div>
  <div class="cloud c2"></div>
</div>

<div id="app">
  <header>
    <button class="hbtn" id="home">🏠</button>
    <div class="stars" id="stars">⭐ 0</div>
    <!-- تم إخفاء زر اللغة لتطابق الصورة، يمكنك تفعيله إذا أردت -->
    <button class="hbtn" id="lng" style="display:none;">EN</button>
  </header>
  
  <div id="stage"></div>
</div>

<script>
const $ = s => document.querySelector(s);
const stage = $('#stage');
let lang = 'ar', stars = 0, cleanup = null, current = null;
try { stars = +localStorage.getItem('kg_stars') || 0; lang = localStorage.getItem('kg_lang') || 'ar'; } catch (e) {}
const save = () => { try { localStorage.setItem('kg_stars', stars); localStorage.setItem('kg_lang', lang); } catch (e) {} };
const L = (ar, en) => lang === 'ar' ? ar : en;
const rnd = n => Math.floor(Math.random() * n);
const pick = a => a[rnd(a.length)];
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = rnd(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pickN = (a, n) => shuffle(a).slice(0, n);

/* ---------- الأصوات ---------- */
let ac;
function tone(f, d = .15, type = 'sine', when = 0, vol = .2) {
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    const o = ac.createOscillator(), g = ac.createGain(), t0 = ac.currentTime + when;
    o.type = type; o.frequency.value = f;
    g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(.001, t0 + d);
    o.connect(g); g.connect(ac.destination); o.start(t0); o.stop(t0 + d);
  } catch (e) {}
}
const sfx = {
  ok() { [523, 659, 784, 1047].forEach((f, i) => tone(f, .2, 'sine', i * .09)); },
  bad() { tone(220, .25, 'sawtooth', 0, .1); },
  pop() { tone(500 + Math.random() * 500, .09, 'square', 0, .08); },
  tap() { tone(600, .06, 'sine', 0, .15); }
};
function say(text, l) {
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = (l || lang) === 'ar' ? 'ar-SA' : 'en-US';
    u.rate = .85; u.pitch = 1.2;
    speechSynthesis.speak(u);
  } catch (e) {}
}
function confetti() {
  const em = ['🎉', '⭐', '🌟', '✨', '🎈', '💖'];
  for (let i = 0; i < 18; i++) {
    const s = document.createElement('span');
    s.className = 'conf'; s.textContent = pick(em);
    s.style.left = rnd(95) + 'vw'; s.style.animationDelay = (Math.random() * .4) + 's';
    document.body.append(s); setTimeout(() => s.remove(), 2200);
  }
}
function win() { sfx.ok(); stars++; save(); updateStars(); confetti(); }
function updateStars() { $('#stars').textContent = '⭐ ' + stars; }

/* ---------- البيانات ---------- */
const COLORS = [
  { hex: '#e53935', ar: 'أحمر', en: 'red' }, { hex: '#1e88e5', ar: 'أزرق', en: 'blue' },
  { hex: '#fdd835', ar: 'أصفر', en: 'yellow' }, { hex: '#43a047', ar: 'أخضر', en: 'green' },
  { hex: '#fb8c00', ar: 'برتقالي', en: 'orange' }, { hex: '#8e24aa', ar: 'بنفسجي', en: 'purple' },
  { hex: '#ec407a', ar: 'وردي', en: 'pink' }, { hex: '#6d4c41', ar: 'بني', en: 'brown' }
];
const ANIMALS = [
  ['🐶', 'كلب', 'Dog'], ['🐱', 'قطة', 'Cat'], ['🐭', 'فأر', 'Mouse'], ['🐰', 'أرنب', 'Rabbit'],
  ['🦊', 'ثعلب', 'Fox'], ['🐻', 'دب', 'Bear'], ['🐼', 'باندا', 'Panda'], ['🦁', 'أسد', 'Lion'],
  ['🐯', 'نمر', 'Tiger'], ['🐮', 'بقرة', 'Cow'], ['🐷', 'خنزير', 'Pig'], ['🐸', 'ضفدع', 'Frog'],
  ['🐵', 'قرد', 'Monkey'], ['🐔', 'دجاجة', 'Chicken'], ['🐧', 'بطريق', 'Penguin'], ['🐘', 'فيل', 'Elephant'],
  ['🦒', 'زرافة', 'Giraffe'], ['🐴', 'حصان', 'Horse'], ['🐑', 'خروف', 'Sheep'], ['🐢', 'سلحفاة', 'Turtle'],
  ['🐟', 'سمكة', 'Fish'], ['🦆', 'بطة', 'Duck']
];
const AR_LET = [
  ['أ', 'أسد', '🦁'], ['ب', 'بطة', '🦆'], ['ت', 'تمساح', '🐊'], ['ث', 'ثعلب', '🦊'], ['ج', 'جمل', '🐪'],
  ['ح', 'حصان', '🐴'], ['خ', 'خروف', '🐑'], ['د', 'دب', '🐻'], ['ذ', 'ذرة', '🌽'], ['ر', 'رمان', '🍎'],
  ['ز', 'زرافة', '🦒'], ['س', 'سمكة', '🐟'], ['ش', 'شمس', '☀️'], ['ص', 'صقر', '🦅'], ['ض', 'ضفدع', '🐸'],
  ['ط', 'طائرة', '✈️'], ['ظ', 'ظرف', '✉️'], ['ع', 'عنب', '🍇'], ['غ', 'غزال', '🦌'], ['ف', 'فيل', '🐘'],
  ['ق', 'قمر', '🌙'], ['ك', 'كلب', '🐶'], ['ل', 'ليمون', '🍋'], ['م', 'موز', '🍌'], ['ن', 'نحلة', '🐝'],
  ['ه', 'هدية', '🎁'], ['و', 'وردة', '🌹'], ['ي', 'يمامة', '🕊️']
];
const EN_LET = [
  ['A', 'Apple', '🍎'], ['B', 'Ball', '⚽'], ['C', 'Cat', '🐱'], ['D', 'Dog', '🐶'], ['E', 'Elephant', '🐘'],
  ['F', 'Fish', '🐟'], ['G', 'Grapes', '🍇'], ['H', 'Hat', '🎩'], ['I', 'Ice cream', '🍦'], ['J', 'Juice', '🧃'],
  ['K', 'Kite', '🪁'], ['L', 'Lion', '🦁'], ['M', 'Moon', '🌙'], ['N', 'Nest', '🪺'], ['O', 'Orange', '🍊'],
  ['P', 'Pig', '🐷'], ['Q', 'Queen', '👑'], ['R', 'Rabbit', '🐰'], ['S', 'Sun', '☀️'], ['T', 'Tree', '🌳'],
  ['U', 'Umbrella', '☂️'], ['V', 'Van', '🚐'], ['W', 'Watch', '⌚'], ['X', 'Xylophone', '🎹'],
  ['Y', 'Yo-yo', '🪀'], ['Z', 'Zebra', '🦓']
];
const SHAPES = [
  { ar: 'دائرة', en: 'circle', svg: c => `<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="42" fill="${c}"/></svg>` },
  { ar: 'مربع', en: 'square', svg: c => `<svg viewBox="0 0 100 100"><rect x="10" y="10" width="80" height="80" rx="6" fill="${c}"/></svg>` },
  { ar: 'مثلث', en: 'triangle', svg: c => `<svg viewBox="0 0 100 100"><polygon points="50,8 94,90 6,90" fill="${c}"/></svg>` },
  { ar: 'نجمة', en: 'star', svg: c => `<svg viewBox="0 0 100 100"><polygon points="50,5 61,38 96,38 68,59 79,92 50,72 21,92 32,59 4,38 39,38" fill="${c}"/></svg>` },
  { ar: 'قلب', en: 'heart', svg: c => `<svg viewBox="0 0 100 100"><path d="M50 90 C8 56 8 16 32 16 C43 16 50 25 50 31 C50 25 57 16 68 16 C92 16 92 56 50 90Z" fill="${c}"/></svg>` },
  { ar: 'مستطيل', en: 'rectangle', svg: c => `<svg viewBox="0 0 100 100"><rect x="4" y="25" width="92" height="50" rx="5" fill="${c}"/></svg>` },
  { ar: 'معيّن', en: 'diamond', svg: c => `<svg viewBox="0 0 100 100"><polygon points="50,4 96,50 50,96 4,50" fill="${c}"/></svg>` },
  { ar: 'بيضاوي', en: 'oval', svg: c => `<svg viewBox="0 0 100 100"><ellipse cx="50" cy="50" rx="46" ry="30" fill="${c}"/></svg>` }
];
const COUNT_EM = ['🍎', '⭐', '🎈', '🐟', '🚗', '🌸', '🍪', '🐥'];
const AR_NUM = ['', 'واحد', 'اثنان', 'ثلاثة', 'أربعة', 'خمسة', 'ستة', 'سبعة', 'ثمانية', 'تسعة', 'عشرة'];

/* ---------- التوجيه ---------- */
function go(fn, title) {
  if (cleanup) { cleanup(); cleanup = null; }
  try { speechSynthesis.cancel(); } catch (e) {}
  current = { fn, title };
  stage.innerHTML = '';
  $('#home').style.visibility = fn === menu ? 'hidden' : 'visible';
  fn();
}
$('#home').onclick = () => { sfx.tap(); go(menu); };
$('#lng').onclick = () => {
  lang = lang === 'ar' ? 'en' : 'ar'; save(); sfx.tap();
  document.documentElement.lang = lang; document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
  $('#lng').textContent = lang === 'ar' ? 'EN' : 'ع';
  go(current.fn, current.title);
};

/* ---------- واجهة القائمة الرئيسية (مطابقة للصورة) ---------- */
const GAMES = [
  { em: '🎈', ar: 'فقّع البالونات', en: 'Pop Balloons', c: 'btn-red', fn: gBalloons },
  { em: '1️⃣2️⃣3️⃣', ar: 'العد والأرقام', en: 'Counting', c: 'btn-blue', fn: gCount },
  { em: '🔤', ar: 'الحروف', en: 'Letters', c: 'btn-purple', fn: gLetters },
  { em: '🔺', ar: 'الأشكال', en: 'Shapes', c: 'btn-green1', fn: gShapes },
  { em: '🎨', ar: 'الألوان', en: 'Colors', c: 'btn-orange', fn: gColors },
  { em: '🦁', ar: 'الحيوانات', en: 'Animals', c: 'btn-green2', fn: gAnimals },
  { em: '🧠', ar: 'لعبة الذاكرة', en: 'Memory', c: 'btn-purple2', fn: gMemory },
  { em: '✏️', ar: 'الرسم', en: 'Drawing', c: 'btn-pink', fn: gDraw }
];

function menu() {
  // إضافة اللوحة الخشبية
  const banner = document.createElement('div');
  banner.className = 'wood-banner';
  banner.innerHTML = `<h1>ألعاب الصغار</h1><p>تعلم .. العب .. واستمتع 💖</p>`;
  stage.append(banner);

  // شبكة الأزرار
  const m = document.createElement('div'); m.className = 'menu';
  GAMES.forEach(g => {
    const b = document.createElement('button'); 
    b.className = `card ${g.c}`;
    b.innerHTML = `<span class="em">${g.em}</span><span class="label-bg">${L(g.ar, g.en)}</span>`;
    b.onclick = () => { sfx.tap(); go(g.fn, () => L(g.ar, g.en)); };
    m.append(b);
  });
  stage.append(m);

  // إضافة الكلب والقطار في الأسفل
  const bottomDecor = document.createElement('div');
  bottomDecor.className = 'bottom-decor';
  bottomDecor.innerHTML = `<div class="dog">🐶</div><div class="train">🚂</div>`;
  stage.append(bottomDecor);
}

/* ---------- الألعاب (بقيت كما هي) ---------- */
function quiz(gen) {
  function next() {
    const q = gen(); let done = false;
    stage.innerHTML = `<div class="prompt"><button class="spk">🔊</button><span class="pt"></span></div><div class="big"></div><div class="hint"></div><div class="opts"></div>`;
    stage.querySelector('.pt').textContent = q.prompt;
    stage.querySelector('.big').innerHTML = q.big || '';
    const o = stage.querySelector('.opts');
    q.options.forEach((h, i) => {
      const b = document.createElement('button'); b.className = 'opt'; b.innerHTML = h;
      b.onclick = () => {
        if (done) return;
        if (i === q.ans) {
          done = true; b.classList.add('good'); win();
          if (q.reveal) { stage.querySelector('.big').innerHTML = q.reveal.big; stage.querySelector('.hint').textContent = q.reveal.text; say(q.reveal.speak, q.reveal.lang); }
          setTimeout(next, 2000);
        } else { b.classList.add('bad'); sfx.bad(); setTimeout(() => b.classList.remove('bad'), 500); }
      };
      o.append(b);
    });
    stage.querySelector('.spk').onclick = () => say(q.speak, q.lang);
    setTimeout(() => { if (!done) say(q.speak, q.lang); }, 350);
  }
  next();
}
function opts3(arr, correct, key) {
  const others = shuffle(arr.filter(x => x !== correct)).slice(0, 2);
  const o = shuffle([correct, ...others]);
  return { list: o, ans: o.indexOf(correct) };
}

function gColors() {
  quiz(() => {
    const c = pick(COLORS), r = opts3(COLORS, c);
    return {
